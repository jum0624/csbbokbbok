version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-dev
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: csbbokbbok_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
  redis:
    image: redis:alpine
    container_name: redis-dev
    command: redis-server --requirepass root
    ports:
      - '6379:6379'
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
